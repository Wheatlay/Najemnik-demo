architecture_summary: >-
  Deliberately reduced vertical slice of the original rental decision workspace:
  server-rendered UI, deterministic cost/ranking logic, isolated guest state and
  recorded evidence. Selected local-model enrichment code is retained for review,
  but it is not wired into the hosted showcase.
guided_recruiter_flow:
  - Follow the gallery tour.
  - Filter and open synthetic listings.
  - Compare advertised, monthly, annual, and move-in costs.
  - Inspect map, rankings, notes, and recorded evidence.
  - Edit a value and reset the isolated guest session.
