verified_claims:
  - Working rental filtering, comparison, cost analysis, map, ranking, notes, and editing flows.
  - Selected source preserves the real local Ollama enrichment architecture.
limitations:
  - Hosted mode disables registration, email, scraping, imports, extension tokens, administration, and live model calls.
  - All public data and images are synthetic.
