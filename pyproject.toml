[project]
name = "mieszkania"
version = "1.0.0"
description = "Local apartment-rental listing tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "playwright>=1.47",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pyflakes + pycodestyle errors/warnings only - the codebase deliberately
# uses naive local datetimes throughout (see core/models.py) and broad
# except clauses in background job runners, so DTZ/BLE and other opinionated
# rule families are left off rather than fought.
select = ["E", "F", "W"]
# `l` for a single listing in a comprehension is this codebase's existing
# convention (core/domain/queries.py, tests) - not worth a repo-wide rename. E501 is
# dominated by long LLM prompt strings (core/pipeline/enrich/, research/benchmark/) and the
# autogenerated Alembic migration - not a useful signal here. E712 fires on
# SQLAlchemy `Column == True` filter expressions, which is the idiomatic
# form (not a Python truthiness bug) since `where()` needs a real
# BinaryExpression, not a bare column. E731 fires on research/benchmark/items.py's
# deliberate per-iteration lambda closures over a loop variable.
ignore = ["E741", "E501", "E712", "E731"]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated - not hand-maintained, don't lint its formatting.
"migrations/versions/*.py" = ["W291", "E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "routers"]
